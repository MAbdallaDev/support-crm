# Render blueprint for the API. The database lives on Neon (Render's free
# Postgres expires after 30 days), so DATABASE_URL is entered by hand.
services:
  - type: web
    name: support-crm-api
    runtime: python
    plan: free
    rootDir: backend
    # Migrations and the demo seed run at build time, not start time: the free
    # instance sleeps when idle, and every wake-up should be a fast gunicorn boot.
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py seed_demo
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: AI_BACKEND
        value: mock
      - key: TIME_ZONE
        value: Asia/Riyadh
